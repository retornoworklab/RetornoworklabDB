name: Automacao Alvaro

on:
  workflow_dispatch:

jobs:
  automatizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install selenium
      - run: python sandalo/automacao_alvaro.py
