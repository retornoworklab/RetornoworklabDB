name: Executar Automação Worklab

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  buscar-laudos:
    strategy:
      matrix:
        login: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: pip install selenium
      
      - name: Buscar laudos - Login ${{ matrix.login }}
        env:
          ID_LAB:  ${{ secrets[format('ID_LAB_{0}', matrix.login)] }}
          USUARIO: ${{ secrets[format('USUARIO_{0}', matrix.login)] }}
          SENHA:   ${{ secrets[format('SENHA_{0}', matrix.login)] }}
        run: python sandalo/automacao_worklab.py
